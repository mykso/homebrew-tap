name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cask:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Taps this repository at the triggering commit, so no checkout step is needed.
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - run: brew audit --cask --strict --online mykso/tap/myks
      - run: brew install --cask mykso/tap/myks
      - run: myks --version
